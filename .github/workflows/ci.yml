name: CI

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        # Workspace root is rgaa-rs/; repo root has no Cargo.toml.
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          working-directory: rgaa-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      # OOM guard: fat-LTO release link of the lance/arrow tree can exceed
      # runner memory with default parallelism (same OOM master's ci.yml
      # guards against in 789d40f). Without this, the runner gets OOM-killed
      # mid-build, which the Actions service reports as "runner has received
      # a shutdown signal" rather than a real compile error — this is what
      # was killing Build & Test on this branch every run.
      - name: Limit build parallelism (OOM guard)
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Build workspace
        env:
          RUSTC_WRAPPER: sccache
        run: |
          # GitHub Actions cancels a step after ~10 minutes with no log
          # output; a cold-cache release build of this workspace (lancedb/
          # datafusion/arrow) can go silent for longer than that compiling a
          # single heavy crate. Keep the step alive with a heartbeat.
          ( while true; do sleep 240; echo "::notice::still building…"; done ) &
          heartbeat=$!
          cargo build --workspace --release
          kill "$heartbeat" 2>/dev/null || true
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-bin-linux-x86_64
          path: |
            rgaa-rs/target/release/rgaa
            rgaa-rs/target/release/rgaa-cli
            rgaa-rs/target/release/rgaa-api
            rgaa-rs/target/release/rgaa-mcp
          if-no-files-found: error
      - name: Run tests
        env:
          RUST_MIN_STACK: 8388608
          RUSTC_WRAPPER: sccache
        run: |
          # Use all available cores for both compilation and test execution
          CORES=$(nproc)
          echo "Using $CORES cores"
          ( while true; do sleep 240; echo "::notice::still testing…"; done ) &
          heartbeat=$!
          cargo test --workspace --jobs $CORES -- --test-threads=$CORES
          kill "$heartbeat" 2>/dev/null || true

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: rgaa-rs-bin-linux-x86_64
          path: bin
      - name: rgaa --version (TUI)
        run: ./bin/rgaa --version
      - name: rgaa-cli --version
        run: ./bin/rgaa-cli --version
      - name: rgaa-cli --help
        run: ./bin/rgaa-cli --help | head -5
      - name: rgaa-api --help
        run: ./bin/rgaa-api --help 2>&1 | head -3
      - name: rgaa-mcp --help
        run: ./bin/rgaa-mcp --help 2>&1 | head -3

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - name: Run clippy
        env:
          RUSTC_WRAPPER: sccache
        run: |
          ( while true; do sleep 240; echo "::notice::still linting…"; done ) &
          heartbeat=$!
          cargo clippy --workspace --all-targets -- -D warnings
          kill "$heartbeat" 2>/dev/null || true

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rgaa-rs
          # RUSTSEC-2023-0071: ReDoS in regex-lite via bstr dependency chain (fastembed).
          # Not introduced by our code; transitive dependency on regex 1.x through fastembed.
          # Tracking: https://github.com/oxalorg/regex/issues/702
          # RUSTSEC-2025-0141: bincode 1.x unmaintained (maintainers ceased development).
          # Pinned transitive dependency of deno_core via the obscura browser substrate;
          # no upgrade path until upstream migrates. Used for trusted IPC payloads only.
          # RUSTSEC-2025-0057: fxhash unmaintained.
          # Pinned transitive dependency via html5ever/markup5ever string_cache;
          # upstream replacement is rustc-hash, pending upstream migration.
          # RUSTSEC-2021-0019: soundness issues in xcb 0.8.2 (requires a
          # malicious X11 server or direct misuse of the flagged unsafe-adjacent
          # APIs). Reached only via clipboard paste in the rgaa-tui input
          # (ratatui_input 0.1.3, stale upstream, no upgrade path). Revisit if
          # the input crate is replaced.
          ignore: "RUSTSEC-2023-0071,RUSTSEC-2025-0141,RUSTSEC-2025-0057,RUSTSEC-2021-0019"

  e2e:
    name: E2E (browser + agent + orchestrator)
    runs-on: ubuntu-latest
    if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - name: Prepare Obscura backend
        working-directory: ${{ github.workspace }}
        run: |
          # Substrate pin gate (keep in sync with OBSCURA_VERSION in install.sh).
          # Binaries are fetched from upstream, never stored in git.
          curl -fSL -o obscura.tar.gz "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.2/obscura-x86_64-linux.tar.gz"
          tar -xzf obscura.tar.gz
          chmod +x obscura obscura-worker
          ./obscura --version | grep -q "obscura 0.2.2" || { echo "obscura version drift: $(./obscura --version)"; exit 1; }
          echo "${{ github.workspace }}" >> "$GITHUB_PATH"
      - name: Validate Holo3 API key
        env:
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
        run: |
          if [ -z "$HOLO3_API_KEY" ]; then
            echo "HOLO3_API_KEY secret not set; skipping E2E"
            exit 0
          fi
      - name: Run E2E pipeline tests
        env:
          RUN_E2E: "1"
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
          HOLO3_BASE_URL: ${{ secrets.HOLO3_BASE_URL }}
          HOLO3_MODEL: ${{ secrets.HOLO3_MODEL }}
        run: cargo test --workspace --test full_audit --test obscura_audit -- --nocapture
