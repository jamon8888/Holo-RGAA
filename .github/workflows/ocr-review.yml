name: AI Code Review
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la PR à relire
        required: true
      base_ref:
        description: Branche de base de la PR
        required: true
      head_sha:
        description: SHA de tête de la PR
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: alibaba/open-code-review@v1.14.1
        with:
          llm_url: https://integrate.api.nvidia.com/v1
          llm_auth_token: ${{ secrets.NVIDIA_API_KEY }}
          llm_model: nvidia/nemotron-3-ultra-550b-a55b
          llm_protocol: openai
          pr_number: ${{ inputs.pr_number }}
          base_ref: ${{ inputs.base_ref }}
          head_sha: ${{ inputs.head_sha }}
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
