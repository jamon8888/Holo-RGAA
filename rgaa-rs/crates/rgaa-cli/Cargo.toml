[package]
description = "CLI tool for RGAA accessibility auditing"
license = "MIT"
name = "rgaa-cli"
version = "0.1.0"
edition = "2021"

[features]
default = ["plugin-echo", "plugin-contrast", "plugin-colorvision", "plugin-lang", "plugin-layout"]
# Dev-only exploration hints. Not part of the audit path; never enabled by default.
dev-explore = ["dep:rgaa-explore"]
plugin-echo = ["rgaa-analysis/plugin-echo", "rgaa-mcp-http/plugin-echo", "rgaa-plugins/plugin-echo"]
plugin-contrast = ["rgaa-analysis/plugin-contrast", "rgaa-mcp-http/plugin-contrast", "rgaa-plugins/plugin-contrast"]
plugin-colorvision = ["rgaa-analysis/plugin-colorvision", "rgaa-mcp-http/plugin-colorvision", "rgaa-plugins/plugin-colorvision"]
plugin-images = ["rgaa-analysis/plugin-images", "rgaa-mcp-http/plugin-images", "rgaa-plugins/plugin-images"]
plugin-media = ["rgaa-analysis/plugin-media", "rgaa-mcp-http/plugin-media", "rgaa-plugins/plugin-media"]
plugin-motion = ["rgaa-analysis/plugin-motion", "rgaa-mcp-http/plugin-motion", "rgaa-plugins/plugin-motion"]
plugin-lang = ["rgaa-analysis/plugin-lang", "rgaa-mcp-http/plugin-lang", "rgaa-plugins/plugin-lang"]
plugin-layout = ["rgaa-analysis/plugin-layout", "rgaa-mcp-http/plugin-layout", "rgaa-plugins/plugin-layout"]
plugin-text = ["rgaa-analysis/plugin-text", "rgaa-mcp-http/plugin-text", "rgaa-plugins/plugin-text"]
plugins-all = [
    "plugin-echo",
    "plugin-contrast",
    "plugin-colorvision",
    "plugin-images",
    "plugin-media",
    "plugin-motion",
    "plugin-lang",
    "plugin-layout",
    "plugin-text",
]

[dependencies]
dotenvy = { workspace = true }
indexmap = { workspace = true }
rgaa-analysis = { path = "../rgaa-analysis", default-features = false }
rgaa-plugins = { path = "../rgaa-plugins", default-features = false }
rgaa-core = { path = "../rgaa-core" }
rgaa-explore = { path = "../rgaa-explore", optional = true }
rgaa-license = { path = "../rgaa-license", default-features = false }
rgaa-mcp-http = { path = "../rgaa-mcp-http", default-features = false }
rgaa-obscura = { path = "../rgaa-obscura" }
rgaa-orchestrator = { path = "../rgaa-orchestrator" }
rgaa-remediation = { path = "../rgaa-remediation" }
rgaa-report = { path = "../rgaa-report" }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender = "0.2"
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }

[dev-dependencies]
rgaa-agent = { path = "../rgaa-agent" }
rgaa-holo = { path = "../rgaa-holo" }
tempfile = "3"
