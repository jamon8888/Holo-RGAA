<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>keydown-delivery</title></head><body>
<button id="a">A</button><button id="b">B</button>
<script>window.__k=[];document.addEventListener("keydown",e=>window.__k.push(e.key+"@"+(document.activeElement&&document.activeElement.id)));</script></body></html>
