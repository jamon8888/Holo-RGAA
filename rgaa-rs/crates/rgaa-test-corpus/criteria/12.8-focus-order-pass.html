<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test 12.8 - Ordre de tabulation sans tabindex positif</title>
</head>
<body>
    <main>
        <h1>Critère 12.8</h1>
        <a href="#a" tabindex="0">Premier lien</a>
        <a href="#b">Deuxième lien</a>
        <div tabindex="0" role="button">Bouton personnalisé</div>
        <button type="button">Bouton natif</button>
    </main>
</body>
</html>
