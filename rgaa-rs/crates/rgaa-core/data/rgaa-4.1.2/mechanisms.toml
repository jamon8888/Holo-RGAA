# Registre unique des mécanismes (spec criteria-coverage-expansion §5, issue #261).
#
# Remplace `axe_mapping.json` (couverture axe) et `COMPLETE_COVERAGE` de `gap_fix.rs`.
# Une entrée `[[mechanism]]` par mécanisme actif. Invariants vérifiés en CI
# (`rgaa_core::registry`, `rgaa-test-corpus/tests/registry_invariants.rs`) :
#   - "pass" dans `outcomes` => `coverage = "complete"` ;
#   - `legacy = false` => fixtures présentes dans `rgaa-test-corpus/criteria/`
#     (une paire `-pass`/`-fail`, ou une paire par test si `complete`) ;
#   - toute règle axe citée existe dans axe-core ;
#   - aucun mécanisme actif sans entrée ici.
# `legacy = true` : hérité, exempté de fixtures. Les critères sans mécanisme
# (anciennes entrées `partial` à `axe_rules: []`) n'apparaissent pas : ils
# retombent dans le repli du pipeline.

