<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>5.7 — témoin : attribut headers vers un id inexistant</title></head>
<body>
<table>
<caption>Témoin</caption>
<tr><th id="h1">Produit</th><th id="h2">Prix</th></tr>
<tr><td headers="h1 does-not-exist">Vélo</td><td headers="h2">300€</td></tr>
</table>
</body>
</html>
