version: "3.8"

services:
  asqatasun-db:
    image: mysql:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: asqatasunDatabaseUserLogin
      MYSQL_PASSWORD: asqatasunDatabaseUserP4ssword
      MYSQL_DATABASE: asqatasun
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  asqatasun:
    image: asqatasun/asqatasun-server-standalone:6.0.0-rc.6
    links:
      - asqatasun-db
    depends_on:
      asqatasun-db:
        condition: service_healthy
    environment:
      DB_DRIVER: mysql
      DB_PORT: 3306
      DB_HOST: asqatasun-db
      DB_USER: asqatasunDatabaseUserLogin
      DB_PASSWORD: asqatasunDatabaseUserP4ssword
      DB_DATABASE: asqatasun
      DISPLAY: ":99"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    ports:
      - "8080:8080"
      - "8443:8443"