criterion = "1.1"
kind      = "axe-native"
engine    = "obscura"
coverage  = "complete"
tests     = []
outcomes  = ["fail", "pass"]
fixtures  = []
legacy    = true
axe_rules = ["image-alt", "input-image-alt", "area-alt", "object-alt", "role-img-alt", "svg-img-alt"]
