[workspace]
resolver = "2"
members = [
    "crates/rgaa-core",
    "crates/rgaa-rules",
    "crates/rgaa-holo",
    "crates/rgaa-orchestrator",
    "crates/rgaa-storage",
    "crates/rgaa-api",
    "crates/rgaa-obscura",
    "crates/rgaa-remediation",
    "crates/rgaa-mcp",
    "crates/rgaa-cli",
    "crates/rgaa-browser-tools",
    "crates/rgaa-agent",
]

[workspace.package]
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = "59.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.3", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.1"
clap = { version = "4.0", features = ["derive"] }
thiserror = "2"
rig-core = "0.42"
rig-agent = "0.42"
rig-lancedb = "0.42"
rig-memory = "0.42"
  lancedb = "0.30"
  fastembed = "4.0"
futures = "0.3"
indexmap = "2"

# Dev profile: optimized for fast compilation
[profile.dev]
debug = 1                    # line-tables-only (faster than full debug info)
incremental = true           # incremental compilation

# Optimize dependencies at level 2 (they rarely change, big perf win)
[profile.dev.package."*"]
opt-level = 2

# Release profile: optimized for small fast binary
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
