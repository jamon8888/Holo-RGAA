<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test 11.5 - Champs de même nature non regroupés</title>
</head>
<body>
    <h1>Critère 11.5 - Boutons radio partageant un name sans fieldset</h1>
    <form>
        <p>Formule d'abonnement</p>
        <label for="f1">Mensuelle</label>
        <input type="radio" id="f1" name="formule" value="mois">
        <label for="f2">Annuelle</label>
        <input type="radio" id="f2" name="formule" value="an">

        <p>Options</p>
        <label for="o1">Newsletter</label>
        <input type="checkbox" id="o1" name="options" value="news">
        <label for="o2">Alertes</label>
        <input type="checkbox" id="o2" name="options" value="alertes">

        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
