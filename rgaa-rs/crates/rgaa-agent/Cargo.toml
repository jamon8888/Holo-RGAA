[package]
name = "rgaa-agent"
version = "0.1.0"
edition = "2021"

[features]
default = ["vector-store"]
vector-store = ["rig-lancedb", "lancedb", "fastembed", "arrow", "rig-memory"]

[dependencies]
rig-core = { workspace = true, features = ["derive"] }
rig-agent = { workspace = true }
rgaa-core = { path = "../rgaa-core" }
rgaa-holo = { path = "../rgaa-holo" }
rgaa-browser-tools = { path = "../rgaa-browser-tools" }
rgaa-remediation = { path = "../rgaa-remediation" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = { workspace = true }

# Optional: LanceDB vector storage (heavy dependencies)
rig-lancedb = { workspace = true, optional = true }
rig-memory = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }
arrow = { version = "58.0.0", optional = true }
