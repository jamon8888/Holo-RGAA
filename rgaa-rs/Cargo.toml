[workspace]
resolver = "2"
members = [
    "crates/rgaa-core",
    "crates/rgaa-rules",
    "crates/rgaa-holo",
    "crates/rgaa-orchestrator",
    "crates/rgaa-storage",
    "crates/rgaa-api",
    "crates/rgaa-obscura",
    "crates/rgaa-remediation",
    "crates/rgaa-mcp",
    "crates/rgaa-cli",
    "crates/rgaa-browser-tools",
    "crates/rgaa-agent",
    "crates/rgaa-data",
    "crates/rgaa-test-corpus",
]

[workspace.package]
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = "59.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.3", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.1"
clap = { version = "4.0", features = ["derive"] }
thiserror = "2"
rig-core = "0.42"
rig-agent = "0.42"
rig-lancedb = "0.42"
rig-memory = "0.42"
  lancedb = "0.30"
  fastembed = "4.0"
  futures = "0.3"
  indexmap = "2"
  chrono = { version = "0.4", features = ["serde"] }

# Dev profile: optimized for fast compilation
[profile.dev]
debug = 1                    # line-tables-only (faster than full debug info)
incremental = true           # incremental compilation
codegen-units = 256          # more units = more parallelism (faster builds)
overflow-checks = false      # skip overflow checks in dev (faster)

# Optimize dependencies at level 2 (they rarely change, big perf win)
[profile.dev.package."*"]
opt-level = 2

# Test profile: fast compilation + reasonable runtime speed
[profile.test]
codegen-units = 256
overflow-checks = false
opt-level = 0  # faster compilation, slower runtime

# Dependencies optimized at level 1 for test (faster runtime)
[profile.test.package."*"]
opt-level = 1

# Release profile: optimized for small fast binary
[profile.release]
opt-level = 3
codegen-units = 1            # single codegen unit for best optimization
lto = "fat"                  # full LTO for maximum optimization
panic = "abort"              # smaller binary, no unwind tables
strip = "symbols"            # remove symbols
overflow-checks = false      # skip overflow checks in release
debug = 0                    # no debug info in release

# Profiling profile: release speed + debug info
[profile.profiling]
inherits = "release"
debug = 1                    # line-tables-only for profiling
strip = "none"               # keep symbols for profiler
