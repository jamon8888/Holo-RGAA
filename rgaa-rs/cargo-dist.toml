[workspace]
cargo-version = "1.80"
 ci = "github"

[project]
name = "rgaa-cli"
version = "0.1.0"
description = "RGAA accessibility audit CLI + TUI"
license = "MIT"
repository = "https://github.com/your-org/rgaa-cli"
windows-msi = true
linux-packages = ["deb", "rpm"]
macos-packages = ["app", "dmg"]

[installers]
powershell = { priority = 1 }
shell = { priority = 2 }
windows-msi = { priority = 3 }

[adapters]
github = "github"

[metadata.rgaa-cli]
create-artifacts = ["linux-x86_64", "linux-aarch64", "darwin-x86_64", "darwin-aarch64", "windows-x86_64"]
