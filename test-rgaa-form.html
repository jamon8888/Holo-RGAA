<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test RGAA Form</title>
</head>
<body>
    <main>
        <h1>Formulaire de test RGAA</h1>
        
        <!-- Formulaire avec problèmes volontaires pour tester -->
        <form action="/submit" method="POST">
            <fieldset>
                <legend>Informations personnelles</legend>
                
                <!-- Input sans label - PROBLÈME 11.1 -->
                <input type="text" name="prenom" id="prenom" required>
                
                <!-- Input avec label correct -->
                <label for="nom">Nom :</label>
                <input type="text" name="nom" id="nom" required>
                
                <!-- Email sans autocomplete - PROBLÈME 11.13 -->
                <label for="email">Email :</label>
                <input type="email" name="email" id="email" required>
                
                <!-- Groupe radio sans fieldset - PROBLÈME 11.5/11.6 -->
                <p>Genre :</p>
                <input type="radio" name="genre" id="homme" value="homme">
                <label for="homme">Homme</label>
                <input type="radio" name="genre" id="femme" value="femme">
                <label for="femme">Femme</label>
                
                <!-- Champ requis sans indication - PROBLÈME 11.8 -->
                <label for="telephone">Téléphone :</label>
                <input type="tel" name="telephone" id="telephone" required>
                
                <!-- Select sans label - PROBLÈME 11.1 -->
                <select name="pays" id="pays">
                    <option value="">Choisir...</option>
                    <option value="fr">France</option>
                </select>
                
                <!-- Textarea sans label - PROBLÈME 11.1 -->
                <textarea name="message" id="message"></textarea>
                
                <button type="submit">Envoyer</button>
            </fieldset>
        </form>
        
        <!-- Lien avec intitulé générique - PROBLÈME 6.2 -->
        <a href="/page2">En savoir plus</a>
        <a href="/page3">Cliquez ici</a>
        
        <!-- Image sans alt - PROBLÈME 1.1 -->
        <img src="test.jpg" alt="">
        
        <!-- Image décorative sans alt="" - PROBLÈME 1.2 -->
        <img src="deco.jpg">
        
        <!-- Vidéo sans sous-titres - PROBLÈME 4.3 -->
        <video src="video.mp4" controls></video>
    </main>
</body>
</html>
