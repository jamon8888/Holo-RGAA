<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Porteurs d'alternative — fixture 1.3.x</title></head>
<body>
<h1>Les sept porteurs d'alternative textuelle du critère 1.3</h1>

<!-- 1.3.1 — img -->
<p><img src="chart.png" alt="ALT-IMG"></p>

<!-- 1.3.2 — area dans une map -->
<p>
  <img src="map.png" alt="ALT-MAP-IMG" usemap="#plan">
  <map name="plan"><area shape="rect" coords="0,0,50,50" href="#a" alt="ALT-AREA"></map>
</p>

<!-- 1.3.3 — input type=image -->
<form action="#"><input type="image" src="submit.png" alt="ALT-INPUT"></form>

<!-- 1.3.4 — object -->
<p><object type="image/png" data="figure.png">ALT-OBJECT</object></p>

<!-- 1.3.5 — embed -->
<p><embed type="image/svg+xml" src="diagram.svg" aria-label="ALT-EMBED"></p>

<!-- 1.3.6 — svg -->
<p>
  <svg role="img" width="40" height="40" viewBox="0 0 40 40">
    <title>ALT-SVG</title><desc>DESC-SVG</desc><circle cx="20" cy="20" r="18" fill="#4c78a8"/>
  </svg>
</p>

<!-- 1.3.7 / 1.3.8 — canvas, contenu de replacement -->
<p><canvas width="40" height="40" role="img" aria-label="ALT-CANVAS">ALT-CANVAS-FALLBACK</canvas></p>

<!-- un porteur sans alternative, pour que l'absence se distingue de l'échec d'extraction -->
<p><img src="noalt.png"></p>
</body>
</html>
