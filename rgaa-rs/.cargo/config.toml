# Build configuration for faster compilation
# Generated: 2026-08-23

# Use mold as linker (2-5x faster than default ld)
[target.x86_64-unknown-linux-gnu]
linker = "gcc"
rustflags = ["-C", "link-arg=-B/home/jamin/.local/opt/mold/bin", "-C", "link-arg=-fuse-ld=mold"]

# Use sccache as compilation cache
[build]
rustc-wrapper = "sccache"
