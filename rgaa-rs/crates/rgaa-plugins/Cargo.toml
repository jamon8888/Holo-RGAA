[package]
description = "Aggregator building the analysis plugin registry from enabled features"
license = "MIT"
name = "rgaa-plugins"
version = "0.1.0"
edition = "2021"

[features]
# The plugins with no model to download are compiled by default (P-00 §3).
default = ["plugin-echo", "plugin-lang"]
plugin-echo = ["rgaa-analysis/plugin-echo"]
plugin-lang = ["rgaa-analysis/plugin-lang", "dep:rgaa-analysis-lang"]
plugin-contrast = ["rgaa-analysis/plugin-contrast"]
plugin-colorvision = ["rgaa-analysis/plugin-colorvision"]
plugin-images = ["dep:rgaa-analysis-images", "rgaa-analysis-images/plugin-images", "rgaa-analysis/plugin-images"]
plugin-media = ["rgaa-analysis/plugin-media", "dep:rgaa-analysis-media"]
plugin-motion = ["rgaa-analysis/plugin-motion"]
plugin-layout = ["rgaa-analysis/plugin-layout"]
plugin-text = ["rgaa-analysis/plugin-text", "dep:rgaa-analysis-text"]
plugins-all = [
    "plugin-echo",
    "plugin-contrast",
    "plugin-colorvision",
    "plugin-images",
    "plugin-media",
    "plugin-motion",
    "plugin-lang",
    "plugin-layout",
    "plugin-text",
]

[dependencies]
rgaa-analysis = { path = "../rgaa-analysis", default-features = false }
rgaa-analysis-lang = { path = "../rgaa-analysis-lang", optional = true }
rgaa-analysis-text = { path = "../rgaa-analysis-text", optional = true }
rgaa-analysis-images = { path = "../rgaa-analysis-images", default-features = false, optional = true }
rgaa-analysis-media = { path = "../rgaa-analysis-media", optional = true }
