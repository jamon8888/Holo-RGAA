name: RGAA Audit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium
          
      - name: Run CI tests
        run: node test-ci.js
        
      - name: Run full audit on test page
        run: node audit-pipeline.js https://example.com --no-sample
        
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            *.json
            !node_modules/**