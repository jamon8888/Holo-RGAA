name: CI

on:
  push:
    branches: [main, master, develop, feat/**]
  # No branch filter: stacked PRs (base = another feature branch) must get
  # the same build/test/lint gate as PRs targeting master.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: "2"

jobs:
  installer-lint:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning install.sh
      - run: bash -n install.sh

  ts-types:
    name: TypeScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgaa-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      # What must never drift is the TOOL NAME SET: a published type naming a
      # tool the server does not register, or missing one it does, is a lie
      # that compiles at the consumer. That is the failure this repo already
      # shipped in its docs (#161), and it is checked strictly below.
      #
      # The argument-type *detail* is not checked for byte-staleness, and
      # deliberately so. It used to be, and the cost was serialisation: every
      # PR adding a tool had to regenerate, and merging one made every other
      # open PR fail on an artifact neither of them had touched. The strong
      # guarantee now lives in `release.yml`, which regenerates from the
      # binary it is publishing — so consumers get types matching the
      # released server by construction, not by someone remembering.
      - name: Generate the tool types
        env:
          RUSTC_WRAPPER: sccache
          CARGO_BUILD_JOBS: "2"
        run: |
          ( while true; do sleep 240; echo "::notice::still building…"; done ) &
          heartbeat=$!
          (cd rgaa-rs && cargo run -p rgaa-mcp --bin dump-tool-schemas) > types/schemas.json
          kill "$heartbeat" 2>/dev/null || true
          python3 scripts/generate-ts-types.py

      - name: The published tool names must match the registered ones
        run: |
          # `|| true` on both: GitHub runs steps with `-eo pipefail`, so a
          # grep that matches nothing kills the step before the diagnostic
          # below can explain why. An empty list is a real condition here
          # (the generator produced nothing, or the attribute shape changed)
          # and it deserves the message, not a bare exit 1.
          registered=$(grep -oE 'name = "[a-z_]+"' \
              rgaa-rs/crates/rgaa-mcp/src/server.rs \
            | sed 's/name = "//; s/"//' | sort -u || true)
          declared=$(grep -oE '^  \| "[a-z_]+"' types/src/tools.d.ts \
            | sed 's/^  | "//; s/"//' | sort -u || true)
          if [ -z "$registered" ] || [ -z "$declared" ]; then
            echo "::error::could not read one of the two tool lists (parser drift?)"
            exit 1
          fi
          if [ "$registered" != "$declared" ]; then
            echo "::error::published tool names do not match the registered ones"
            diff <(echo "$registered") <(echo "$declared") || true
            exit 1
          fi
          echo "tool names agree ($(echo "$registered" | wc -w) tools)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check the published declarations
        working-directory: types
        run: npx --yes -p typescript@5.6 tsc --noEmit --strict src/index.d.ts
      - name: Example client parses
        run: node --check examples/codex-client/client.mjs

  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    # Postgres for rgaa-storage's union-schema integration test
    # (tests/union_schema.rs reads DATABASE_URL; skipped when unset).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rgaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgaa-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      # OOM guard: fat-LTO release link of the lance/arrow tree can exceed
      # runner memory with default parallelism (same as release.yml's build
      # job). Without this, the runner gets OOM-killed mid-build, which the
      # Actions service reports as "runner has received a shutdown signal"
      # rather than a real compile error.
      - name: Limit build parallelism (OOM guard)
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Build workspace
        env:
          RUSTC_WRAPPER: sccache
          # This workspace produces 5 binaries (rgaa, rgaa-cli, rgaa-api,
          # rgaa-mcp, rgaa-tui) that all statically link the same heavy
          # dependency graph (lancedb/datafusion/arrow/ort/tokenizers via
          # rgaa-agent's vector-store feature). Unbounded parallelism lets
          # cargo link several of them at once, and that peak — even with
          # mold — was pushing the runner into memory pressure and getting
          # the step SIGTERMed (exit 143) right at that stage. Capping jobs
          # bounds how many simultaneous links can happen; slower, but
          # doesn't get killed.
          CARGO_BUILD_JOBS: "2"
        run: |
          # GitHub Actions cancels a step after ~10 minutes with no log
          # output; a cold-cache release build of this workspace (lancedb/
          # datafusion/arrow) can go silent for longer than that compiling a
          # single heavy crate. Keep the step alive with a heartbeat.
          ( while true; do sleep 240; echo "::notice::still building…"; done ) &
          heartbeat=$!
          cargo build --workspace --release
          kill "$heartbeat" 2>/dev/null || true
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-bin-linux-x86_64
          path: |
            rgaa-rs/target/release/rgaa
            rgaa-rs/target/release/rgaa-cli
            rgaa-rs/target/release/rgaa-api
            rgaa-rs/target/release/rgaa-mcp
          if-no-files-found: error
      - name: Run tests
        env:
          RUST_MIN_STACK: 8388608
          RUSTC_WRAPPER: sccache
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rgaa
          # Same simultaneous-multi-binary-link memory pressure as the build
          # step above, but for nextest's per-crate test binaries.
          CARGO_BUILD_JOBS: "2"
        run: |
          ( while true; do sleep 240; echo "::notice::still testing…"; done ) &
          heartbeat=$!
          cargo nextest run --workspace
          kill "$heartbeat" 2>/dev/null || true
      - name: Run doc tests
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --doc

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: rgaa-rs-bin-linux-x86_64
          path: bin
      - name: Restore executable bit
        # upload-artifact/download-artifact round-trips files through a zip
        # that doesn't preserve the executable bit on Linux.
        run: chmod +x bin/*
      - name: rgaa --version (TUI)
        run: ./bin/rgaa --version
      - name: rgaa-cli --version
        run: ./bin/rgaa-cli --version
      - name: rgaa-cli --help
        run: ./bin/rgaa-cli --help | head -5
      - name: rgaa-api --help
        run: ./bin/rgaa-api --help 2>&1 | head -3
      - name: rgaa-mcp --help
        run: ./bin/rgaa-mcp --help 2>&1 | head -3

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgaa-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - env:
          RUSTC_WRAPPER: sccache
        run: |
          ( while true; do sleep 240; echo "::notice::still linting…"; done ) &
          heartbeat=$!
          cargo clippy --workspace --all-targets -- -D warnings
          kill "$heartbeat" 2>/dev/null || true

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rgaa-rs
          # RUSTSEC-2023-0071: ReDoS in regex-lite via bstr dependency chain (fastembed).
          # Not introduced by our code; transitive dependency on regex 1.x through fastembed.
          # Tracking: https://github.com/oxalorg/regex/issues/702
          #
          # RUSTSEC-2026-0253, RUSTSEC-2026-0002: unsound `lru` 0.12.5 (panic-safety /
          # Stacked-Borrows issues in LruCache::pop/IterMut), transitive via lancedb's
          # dependency tree (rgaa-agent's vector-store feature). Not introduced by our
          # code; upgrading past it means upgrading lancedb, out of scope here.
          #
          # RUSTSEC-2025-0141: bincode 1.x unmaintained (maintainers ceased development).
          # Pinned transitive dependency of deno_core via the obscura browser substrate;
          # no upgrade path until upstream migrates. Used for trusted IPC payloads only.
          # RUSTSEC-2025-0057: fxhash unmaintained.
          # Pinned transitive dependency via selectors/obscura-dom's CSS matching;
          # upstream replacement is rustc-hash, pending upstream migration.
          #
          # RUSTSEC-2026-0285 (rustls TLS 1.3 handshake bug) and RUSTSEC-2021-0019
          # (xcb soundness, reached only via clipboard paste in rgaa-tui's now-removed
          # ratatui_input dependency) were real, failing vulnerabilities — fixed
          # directly instead of ignored: `cargo update -p rustls` (>=0.23.45) and
          # dropping the unused `ratatui_input` dependency in rgaa-tui, which was the
          # sole path pulling in xcb and wasn't referenced anywhere in the crate.
          # `cargo tree -i xcb` confirms xcb no longer appears in the tree.
          ignore: "RUSTSEC-2023-0071,RUSTSEC-2026-0253,RUSTSEC-2026-0002,RUSTSEC-2025-0141,RUSTSEC-2025-0057"

  e2e:
    name: E2E (browser + agent + orchestrator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgaa-rs
    steps:
      - name: Check E2E prerequisites
        if: ${{ vars.HOLO3_E2E_ENABLED != 'true' }}
        working-directory: .
        run: |
          echo "::notice::E2E skipped: set repository variable HOLO3_E2E_ENABLED=true to enable"
          exit 0
      - uses: actions/checkout@v4
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
      - uses: mozilla-actions/sccache-action@v0.0.7
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
      - uses: rui314/setup-mold@v1
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
      - name: Install system dependencies
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - name: Prepare Obscura backend
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          curl -fSL -o obscura.tar.gz "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.2/obscura-x86_64-linux.tar.gz"
          tar -xzf obscura.tar.gz
          chmod +x obscura obscura-worker
          ./obscura --version | grep -q "obscura 0.2.2" || { echo "obscura version drift: $(./obscura --version)"; exit 1; }
          echo "${{ github.workspace }}" >> "$GITHUB_PATH"
      - name: Validate Holo3 API key
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
        env:
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
        run: |
          if [ -z "$HOLO3_API_KEY" ]; then
            echo "HOLO3_API_KEY secret not set; skipping E2E"
            exit 0
          fi
      - name: Run E2E pipeline tests
        if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
        working-directory: rgaa-rs
        env:
          RUN_E2E: "1"
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
          HOLO3_BASE_URL: ${{ secrets.HOLO3_BASE_URL }}
          HOLO3_MODEL: ${{ secrets.HOLO3_MODEL }}
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --test full_audit --test obscura_audit -- --nocapture
