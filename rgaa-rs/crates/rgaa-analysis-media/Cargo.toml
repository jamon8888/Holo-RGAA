[package]
description = "P-04 analysis plugin: temporal media (audio and video) evidence"
license = "MIT"
name = "rgaa-analysis-media"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
ebur128 = "0.1"
indexmap = { workspace = true }
ndarray = "0.17"
rgaa-analysis = { path = "../rgaa-analysis", default-features = false }
# Exact same version as fastembed 7.7 in rgaa-agent — one ONNX Runtime in the
# workspace binary, never a second one (ticket #421 decision).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["ndarray", "std", "api-24", "download-binaries", "tls-native"] }
rubato = "5.1"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { version = "0.6", features = ["aac", "mp3", "isomp4"] }
tracing = { workspace = true }
webvtt-parser = "1.4"
# whisper.cpp / ggml: no ONNX, therefore no second runtime.
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
