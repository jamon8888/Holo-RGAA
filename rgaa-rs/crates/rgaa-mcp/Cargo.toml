[package]
description = "MCP (Model Context Protocol) server for RGAA auditing"
license = "MIT"
name = "rgaa-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = { workspace = true }
rgaa-core = { path = "../rgaa-core" }
rgaa-obscura = { path = "../rgaa-obscura" }
rgaa-orchestrator = { path = "../rgaa-orchestrator" }
rgaa-remediation = { path = "../rgaa-remediation" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# `test-util` for `#[tokio::test(start_paused = true)]`: the timeout
# tests advance virtual time instead of sleeping 30 real seconds.
# It is not part of tokio's `full` feature.
tokio = { workspace = true, features = ["test-util"] }
