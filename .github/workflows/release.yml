      - name: Build rgaa-cli
        working-directory: rgaa-rs
        run: cargo build --release -p rgaa-cli

      - name: Package binaries
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PLATFORM="linux-x86_64"
          STAGING="rgaa-${PLATFORM}"
          mkdir -p "${STAGING}"

          cp rgaa-rs/target/release/rgaa-mcp "${STAGING}/"
          cp rgaa-rs/target/release/rgaa-cli "${STAGING}/"

          # Include obscura if available in repo
          if [[ -f obscura ]]; then
            cp obscura "${STAGING}/"
          fi
          if [[ -f obscura-worker ]]; then
            cp obscura-worker "${STAGING}/"
          fi

          # Include install script and config
          cp install.sh "${STAGING}/"
          cp -r .rgaa "${STAGING}/default-config"

          tar -czf "${STAGING}.tar.gz" "${STAGING}"
          echo "ASSET=${STAGING}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
