name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  # ─── Build ─────────────────────────────────────────────────────────────────

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rgaa-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: no aarch64-unknown-linux-gnu cross job — openssl-sys cannot
          # find ARM OpenSSL inside the cross container (pkg-config fails).
          # ARM Linux users build from source: install.sh --build
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            tarball: rgaa-rs-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            tarball: rgaa-rs-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            tarball: rgaa-rs-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Windows build deps (Perl + NASM for aws-lc-sys)
        if: runner.os == 'Windows'
        run: choco install nasm strawberryperl -y
        shell: bash

      - name: Install protoc (Windows, for lance-encoding)
        if: runner.os == 'Windows'
        run: |
          $v = "28.3"
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip"
          Expand-Archive protoc.zip -DestinationPath protoc
          "PROTOC=$pwd\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
          & "$pwd\protoc\bin\protoc.exe" --version
        shell: pwsh

      - name: Install macOS build deps (protoc for lance)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf ../../../rgaa-rs/dist/${{ matrix.tarball }} rgaa rgaa-cli rgaa-api rgaa-mcp
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          powershell -Command "Compress-Archive -Path 'rgaa.exe','rgaa-cli.exe','rgaa-api.exe','rgaa-mcp.exe' -DestinationPath '../../../rgaa-rs/dist/rgaa-rs-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip'"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-${{ matrix.target }}
          path: rgaa-rs/dist/${{ matrix.tarball }}
          if-no-files-found: error

  # ─── Smoke test ───────────────────────────────────────────────────────────

  smoke:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rgaa-rs-${{ matrix.target }}
          path: artifact

      - name: Extract (Unix)
        if: runner.os != 'Windows'
        run: tar xzf artifact/*.tar.gz -C artifact/

      - name: Extract (Windows)
        if: runner.os == 'Windows'
        run: powershell -Command "Expand-Archive -Path 'artifact/*.zip' -DestinationPath 'artifact/'"

      - name: Run rgaa --version (TUI)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa.exe --version
          else
            ./artifact/rgaa --version
          fi

      - name: Run rgaa-cli --version
        id: version
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-cli.exe --version
          else
            ./artifact/rgaa-cli --version
          fi

      - name: Run rgaa-cli --help
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-cli.exe --help | head -5
          else
            ./artifact/rgaa-cli --help | head -5
          fi

      - name: Run rgaa-api --help
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-api.exe --help 2>&1 | head -3
          else
            ./artifact/rgaa-api --help 2>&1 | head -3
          fi

      - name: Run rgaa-mcp --help
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-mcp.exe --help 2>&1 | head -3
          else
            ./artifact/rgaa-mcp --help 2>&1 | head -3
          fi

  # ─── Publish GitHub Release ────────────────────────────────────────────────

  release:
    name: Publish GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}

  # ─── Publish to crates.io ─────────────────────────────────────────────────

  publish:
    name: Publish to crates.io
    needs: [build, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rgaa-core
          - rgaa-rules
          - rgaa-holo
          - rgaa-obscura
          - rgaa-storage
          - rgaa-orchestrator
          - rgaa-remediation
          - rgaa-agent
          - rgaa-api
          - rgaa-mcp
          - rgaa-cli
          - rgaa-tui
          - rgaa-browser-tools
          - rgaa-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ${{ matrix.crate }}
        working-directory: rgaa-rs
