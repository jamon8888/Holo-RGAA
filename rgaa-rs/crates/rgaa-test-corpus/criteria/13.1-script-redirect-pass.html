<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test 13.1 - Carrousel automatique sans redirection</title>
</head>
<body>
    <main>
        <h1>Critère 13.1</h1>
        <p>Un carrousel change de diapositive toutes les secondes ; la page ne navigue jamais.</p>
        <div id="slide" aria-live="off">1</div>
        <button type="button" onclick="clearInterval(timer)">Pause</button>
    </main>
    <script>
        var n = 1;
        var timer = setInterval(function () {
            n = (n % 3) + 1;
            document.getElementById('slide').textContent = n;
        }, 1000);
    </script>
</body>
</html>
