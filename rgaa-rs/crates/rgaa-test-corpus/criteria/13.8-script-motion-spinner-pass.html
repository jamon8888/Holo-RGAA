<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test 13.8 - Indicateur de chargement</title>
</head>
<body>
    <main>
        <h1>Critère 13.8</h1>
        <div id="spinner" role="progressbar" aria-label="Chargement">|</div>
    </main>
    <script>
        var frames = ['|', '/', '-', '\\'];
        var i = 0;
        setInterval(function () { i = (i + 1) % 4; document.getElementById('spinner').textContent = frames[i]; }, 500);
    </script>
</body>
</html>
