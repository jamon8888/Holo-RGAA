name: CI

on:
  push:
    branches: [main, develop, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

defaults:
  run:
    working-directory: rgaa-rs

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - name: Build workspace
        run: cargo build --workspace --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-bin-linux-x86_64
          path: |
            rgaa-rs/target/release/rgaa-cli
            rgaa-rs/target/release/rgaa-api
            rgaa-rs/target/release/rgaa-mcp
          if-no-files-found: error
      - name: Run tests
        env:
          RUST_MIN_STACK: 8388608
        run: |
          # Use all available cores for both compilation and test execution
          CORES=$(nproc)
          echo "Using $CORES cores"
          cargo test --workspace --jobs $CORES --test-threads=$CORES

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rgaa-rs
          ignore: "RUSTSEC-2023-0071"

  e2e:
    name: E2E (browser + agent + orchestrator)
    runs-on: ubuntu-latest
    if: ${{ vars.HOLO3_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils
      - name: Prepare Obscura backend
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x obscura obscura-worker
          echo "${{ github.workspace }}" >> "$GITHUB_PATH"
      - name: Validate Holo3 API key
        env:
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
        run: |
          if [ -z "$HOLO3_API_KEY" ]; then
            echo "HOLO3_API_KEY secret not set; skipping E2E"
            exit 0
          fi
      - name: Run E2E pipeline tests
        env:
          RUN_E2E: "1"
          HOLO3_API_KEY: ${{ secrets.HOLO3_API_KEY }}
          HOLO3_BASE_URL: ${{ secrets.HOLO3_BASE_URL }}
          HOLO3_MODEL: ${{ secrets.HOLO3_MODEL }}
        run: cargo test --workspace --test full_audit --test obscura_audit -- --nocapture
