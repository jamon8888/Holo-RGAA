name: Release

on:
  push:
    tags:
      - 'v*'
      - 'latest'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'latest' }}

jobs:
  # ─── Build ─────────────────────────────────────────────────────────────────

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rgaa-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: no aarch64-unknown-linux-gnu cross job — openssl-sys cannot
          # find ARM OpenSSL inside the cross container (pkg-config fails).
          # ARM Linux users build from source: install.sh --build
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            tarball: rgaa-rs-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'latest' }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            tarball: rgaa-rs-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'latest' }}-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            tarball: rgaa-rs-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'latest' }}-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: .exe
            zip: rgaa-rs-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'latest' }}-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Install Windows build deps (Perl + NASM for aws-lc-sys)
        if: runner.os == 'Windows'
        run: choco install nasm strawberryperl -y
        shell: bash

      - name: Install protoc (Windows, for lance-encoding)
        if: runner.os == 'Windows'
        run: |
          $v = "28.3"
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip"
          Expand-Archive protoc.zip -DestinationPath protoc
          "PROTOC=$pwd\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
          & "$pwd\protoc\bin\protoc.exe" --version
        shell: pwsh

      - name: Install macOS build deps (protoc for lance)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins an exact channel, so cargo runs under that
      # rustup toolchain — not `stable`, where the step above installed the
      # target. Add it to the toolchain actually in use (cross jobs such as
      # x86_64-apple-darwin on an arm64 runner otherwise fail with E0463
      # "can't find crate for `core`").
      - name: Add target to pinned toolchain
        run: rustup target add ${{ matrix.target }}
        shell: bash

      # .cargo/config.toml forces `-fuse-ld=mold` for x86_64-unknown-linux-gnu;
      # without the binary on PATH the link fails with "cannot find 'ld'".
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgaa-rs

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils

      # OOM guard: fat-LTO release link of the lance/arrow tree can exceed
      # runner memory with default parallelism. Halve codegen jobs on Linux.
      - name: Limit build parallelism (Linux OOM guard)
        if: runner.os == 'Linux'
        run: echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release -p rgaa-tui -p rgaa-cli -p rgaa-api -p rgaa-mcp
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rgaa-rs/dist"
          cd "$GITHUB_WORKSPACE/rgaa-rs/target/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/rgaa-rs/dist/${{ matrix.tarball }}" rgaa rgaa-cli rgaa-api rgaa-mcp
          cd "$GITHUB_WORKSPACE/rgaa-rs/dist"
          sha256sum "${{ matrix.tarball }}" > "${{ matrix.tarball }}.sha256"
          base="$(basename "${{ matrix.tarball }}" .tar.gz)"
          printf '{"tag": "%s", "obscura_version": "0.2.2", "bins": ["rgaa", "rgaa-cli", "rgaa-api", "rgaa-mcp"]}\n' "${{ env.TAG }}" > "${base}.manifest.json"
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location target/${{ matrix.target }}/release
          Compress-Archive -Path rgaa.exe,rgaa-cli.exe,rgaa-api.exe,rgaa-mcp.exe -DestinationPath "$env:GITHUB_WORKSPACE/rgaa-rs/dist/${{ matrix.zip }}" -Force
          Pop-Location
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.zip }}").Hash.ToLower()
          "$hash  ${{ matrix.zip }}" | Set-Content -Encoding ascii "${{ matrix.zip }}.sha256"
          $base = [System.IO.Path]::GetFileNameWithoutExtension("${{ matrix.zip }}")
          $manifest = '{"tag": "' + "${{ env.TAG }}" + '", "obscura_version": "0.2.2", "bins": ["rgaa", "rgaa-cli", "rgaa-api", "rgaa-mcp"]}'
          Set-Content -Path "$base.manifest.json" -Value $manifest -Encoding ascii
          Pop-Location
        shell: pwsh

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-${{ env.TAG }}-${{ matrix.target }}
          path: |
            rgaa-rs/dist/${{ matrix.tarball }}
            rgaa-rs/dist/${{ matrix.tarball }}.sha256
            rgaa-rs/dist/*.manifest.json
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-${{ env.TAG }}-${{ matrix.target }}
          path: |
            rgaa-rs/dist/${{ matrix.zip }}
            rgaa-rs/dist/${{ matrix.zip }}.sha256
            rgaa-rs/dist/*.manifest.json
          if-no-files-found: error

  # ─── Smoke test ───────────────────────────────────────────────────────────

  smoke:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rgaa-rs-${{ env.TAG }}-${{ matrix.target }}
          path: artifact

      - name: Verify checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd artifact
          sha256sum -c *.sha256

      - name: Verify checksum (Windows)
        if: runner.os == 'Windows'
        run: |
          Push-Location artifact
          $sums = Get-Content *.sha256
          foreach ($line in $sums) {
            $parts = $line -split '\s+', 2
            $expected = $parts[0].Trim()
            $file = $parts[1].Trim()
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Host "Checksum mismatch for $file" -ForegroundColor Red
              exit 1
            }
          }
          Pop-Location
        shell: pwsh

      - name: Extract (Unix)
        if: runner.os != 'Windows'
        run: tar xzf artifact/*.tar.gz -C artifact/

      - name: Extract (Windows)
        if: runner.os == 'Windows'
        run: powershell -Command "Expand-Archive -Path 'artifact/*.zip' -DestinationPath 'artifact/'"

      - name: Run rgaa --version (TUI)
        if: matrix.os != 'macos-latest' || matrix.target == 'x86_64-apple-darwin'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa.exe --version
          else
            ./artifact/rgaa --version
          fi

      - name: Run rgaa-cli --version
        if: matrix.os != 'macos-latest' || matrix.target == 'x86_64-apple-darwin'
        id: version
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-cli.exe --version
          else
            ./artifact/rgaa-cli --version
          fi

      - name: Run rgaa-cli --help
        if: matrix.os != 'macos-latest' || matrix.target == 'x86_64-apple-darwin'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-cli.exe --help | head -5
          else
            ./artifact/rgaa-cli --help | head -5
          fi

      - name: Run rgaa-api --help
        if: matrix.os != 'macos-latest' || matrix.target == 'x86_64-apple-darwin'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-api.exe --help 2>&1 | head -3
          else
            ./artifact/rgaa-api --help 2>&1 | head -3
          fi

      - name: Run rgaa-mcp --help
        if: matrix.os != 'macos-latest' || matrix.target == 'x86_64-apple-darwin'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./artifact/rgaa-mcp.exe --help 2>&1 | head -3
          else
            ./artifact/rgaa-mcp --help 2>&1 | head -3
          fi

  # ─── Installer E2E ────────────────────────────────────────────────────────

  installer-e2e:
    name: Installer E2E (${{ matrix.os }})
    needs: [build, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rgaa-rs-${{ env.TAG }}-${{ matrix.target }}
          path: staged

      - name: Stage artifacts for installer (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p serve
          cp staged/*.tar.gz staged/*.sha256 serve/ 2>/dev/null || true

      - name: Serve staged artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m http.server 8420 --directory serve &
          echo $! > /tmp/http_server.pid
          sleep 1

      - name: Run installer (Unix)
        if: runner.os != 'Windows'
        env:
          RGAA_RELEASE_URL_BASE: http://127.0.0.1:8420
          RGAA_VERSION: ${{ env.TAG }}
          RGAA_INSTALL_DIR: ${{ runner.temp }}/rgaa-install
        run: |
          bash install.sh
          "${RGAA_INSTALL_DIR}/rgaa" --version
          "${RGAA_INSTALL_DIR}/rgaa-cli" --version

      - name: Stop server (Unix)
        if: always() && runner.os != 'Windows'
        run: kill "$(cat /tmp/http_server.pid)" 2>/dev/null || true

      - name: Stage artifacts for installer (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path serve | Out-Null
          Copy-Item staged\*.zip serve\ -ErrorAction SilentlyContinue
          Copy-Item staged\*.sha256 serve\ -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Serve staged artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Start-Process -FilePath python -ArgumentList "-m","http.server","8420","--directory","serve" -WindowStyle Hidden
          Start-Sleep -Seconds 1
        shell: pwsh

      - name: Run installer (Windows)
        if: runner.os == 'Windows'
        env:
          RGAA_RELEASE_URL_BASE: http://127.0.0.1:8420
        run: |
          ./rgaa-rs/install.ps1 -Version "${{ env.TAG }}"
          & "$env:LOCALAPPDATA\rgaa\bin\rgaa.exe" --version
        shell: pwsh

  # ─── Publish GitHub Release ────────────────────────────────────────────────

  release:
    name: Publish GitHub Release
    needs: [build, smoke, installer-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing "latest" release
        if: env.TAG == 'latest'
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG == 'latest' && format('Latest Build ({0})', github.sha) || env.TAG }}
          prerelease: ${{ env.TAG == 'latest' }}
          target_commitish: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
