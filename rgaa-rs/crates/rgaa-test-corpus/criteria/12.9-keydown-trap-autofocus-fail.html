<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test 12.9 - piège clavier (autofocus)</title>
</head>
<body>
    <main>
        <h1>Piège clavier avec autofocus</h1>
        <input id="champ" autofocus aria-label="Champ piégé">
    </main>
    <script>
document.getElementById('champ').addEventListener('keydown', function (e) { if (e.key === 'Tab') e.preventDefault(); });
    </script>
</body>
</html>
