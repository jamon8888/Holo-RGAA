[workspace]
resolver = "2"
members = [
    "crates/rgaa-core",
    "crates/rgaa-rules",
    "crates/rgaa-holo",
    "crates/rgaa-obscura",
    "crates/rgaa-storage",
    "crates/rgaa-orchestrator",
    "crates/rgaa-remediation",
    "crates/rgaa-agent",
    "crates/rgaa-api",
    "crates/rgaa-mcp",
    "crates/rgaa-cli",
    "crates/rgaa-browser-tools",
    "crates/rgaa-data",
    "crates/rgaa-test-corpus",
    "crates/rgaa-spider",
    "crates/rgaa-tui",
]

[workspace.package]
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = "59.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.3", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.1"
clap = { version = "4.0", features = ["derive"] }
thiserror = "2"
rig-core = "0.42"
rig-agent = "0.42"
rig-lancedb = "0.42"
rig-memory = "0.42"
lancedb = "0.30"
fastembed = "4.0"
futures = "0.3"
indexmap = "2"
chrono = { version = "0.4", features = ["serde"] }
spider = { version = "2.53", default-features = false, features = ["sync", "reqwest_native_tls_native_roots"] }

[profile.dev]
debug = 1
incremental = true
codegen-units = 256
overflow-checks = false

[profile.dev.package."*"]
opt-level = 2

[profile.test]
codegen-units = 256
overflow-checks = false
opt-level = 0

[profile.test.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = 0

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
