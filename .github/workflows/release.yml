name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# Build jobs only need read; publish job needs write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rgaa-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        if: matrix.cross
        uses: taiki1978/install-action@v2
        with:
          tool: cross

      - name: Install Windows build deps (Perl + NASM for aws-lc-sys)
        if: runner.os == 'Windows'
        run: choco install nasm strawberryperl -y
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libssl-dev binutils

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rgaa-rs-${{ matrix.target }}.tar.gz rgaa-cli rgaa-api rgaa-mcp
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path rgaa-cli.exe, rgaa-api.exe, rgaa-mcp.exe -DestinationPath ../../../rgaa-rs-${{ matrix.target }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgaa-rs-${{ matrix.target }}
          path: rgaa-rs/rgaa-rs-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Crates are published in dependency order so each publish succeeds.
    # Skip test-corpus and data (internal test utilities).
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rgaa-core
          - rgaa-rules
          - rgaa-holo
          - rgaa-obscura
          - rgaa-storage
          - rgaa-orchestrator
          - rgaa-remediation
          - rgaa-agent
          - rgaa-api
          - rgaa-mcp
          - rgaa-cli
          - rgaa-browser-tools
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p ${{ matrix.crate }}
        working-directory: rgaa-rs