# CodeRabbit AI review: runs on every commit pushed to a pull request.
#
# Required repository secret: OPENAI_API_KEY (Settings → Secrets → Actions).
# Without it the job fails fast with an explicit message instead of
# silently skipping the review.

name: CodeRabbit Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    name: CodeRabbit Review
    runs-on: ubuntu-latest
    steps:
      - name: Check review secret
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::OPENAI_API_KEY secret is missing: add it in Settings → Secrets → Actions."
            exit 1
          fi

      - uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
